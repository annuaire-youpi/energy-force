<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5B7FBF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Energy Force">
  <title>Energy Force — CRM Coaching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%235B7FBF'/><text x='50%25' y='58%25' font-family='Arial' font-size='110' text-anchor='middle' fill='white' font-weight='bold'>EF</text></svg>">
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%235B7FBF'/><text x='50%25' y='62%25' font-family='Arial' font-size='38' text-anchor='middle' fill='white' font-weight='bold'>EF</text></svg>">
  <style>
    /* ============================================================
       RESET + BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    button, input, select, textarea {
      font-family: inherit; font-size: inherit; color: inherit;
    }
    button { cursor: pointer; border: none; background: none; }
    input, textarea, select { outline: none; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ============================================================
       VARIABLES
       ============================================================ */
    :root {
      --bg: #f7f8fa;
      --bg-soft: #f1f3f6;
      --card: #ffffff;
      --border: #e4e7ec;
      --border-strong: #d0d5dd;
      --text: #0f172a;
      --text-muted: #475569;
      --text-soft: #94a3b8;
      --primary: #5B7FBF;
      --primary-hover: #4567A8;
      --primary-soft: #DDE6F5;
      --primary-soft-2: #EEF3FB;
      --accent: #1e293b;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --info: #0284c7;
      --info-soft: #e0f2fe;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 2px 12px rgba(15,23,42,.06);
      --shadow-lg: 0 12px 32px rgba(15,23,42,.14);
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --header-h: 60px;
      --bottom-nav-h: 64px;
      --sidebar-w: 240px;
    }

    /* ============================================================
       UTILITAIRES
       ============================================================ */
    .hidden { display: none !important; }
    .center { display: flex; align-items: center; justify-content: center; }
    .row { display: flex; align-items: center; gap: 8px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-muted { color: var(--text-muted); }
    .text-soft { color: var(--text-soft); }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 12px; }
    .text-lg { font-size: 17px; }
    .text-xl { font-size: 20px; }
    .text-2xl { font-size: 26px; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
    .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }

    /* ============================================================
       SPLASH SCREEN
       ============================================================ */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #EEF3FB 0%, #f7f8fa 60%);
      z-index: 100;
    }
    .splash-card {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow);
    }
    .splash-logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #5B7FBF, #7B9DD0);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 24px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(13,148,136,.25);
    }
    .splash-title {
      text-align: center;
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .pin-display {
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 20px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 2px solid var(--border-strong);
      transition: all 0.2s ease;
    }
    .pin-dot.filled {
      background: var(--primary);
      border-color: var(--primary);
      transform: scale(1.1);
    }
    .pin-dot.error {
      background: var(--danger);
      border-color: var(--danger);
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 0 auto;
    }
    .pin-key {
      aspect-ratio: 1.4;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 20px; font-weight: 600;
      transition: all 0.15s ease;
      color: var(--text);
    }
    .pin-key:hover { background: var(--bg-soft); }
    .pin-key:active { transform: scale(0.95); background: var(--primary-soft); }
    .pin-key.action {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      font-size: 14px;
    }
    .pin-msg {
      text-align: center;
      font-size: 13px;
      min-height: 18px;
      margin: 12px 0;
      color: var(--text-muted);
    }
    .pin-msg.error { color: var(--danger); }
    .pin-msg.success { color: var(--success); }
    .splash-divider {
      display: flex; align-items: center;
      margin: 24px 0 16px;
      color: var(--text-soft);
      font-size: 12px;
      gap: 12px;
    }
    .splash-divider::before, .splash-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .demo-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #fb923c, #f97316);
      color: white;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 15px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(249,115,22,.25);
    }
    .demo-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(249,115,22,.35); }
    .demo-btn:active { transform: translateY(0); }
    .splash-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-soft);
    }

    /* ============================================================
       APP SHELL
       ============================================================ */
    #app {
      display: none;
      min-height: 100vh; min-height: 100dvh;
    }
    #app.active { display: block; }

    .header {
      position: sticky; top: 0;
      height: var(--header-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 50;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }
    .header-logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #5B7FBF, #7B9DD0);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .header-actions {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
    }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
      font-size: 18px;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--text); }
    .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #fb923c, #f97316);
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      box-shadow: 0 2px 8px rgba(249,115,22,.3);
    }

    /* Layout */
    .layout {
      display: flex;
    }
    .sidebar {
      display: none;
      width: var(--sidebar-w);
      min-height: calc(100vh - var(--header-h));
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      flex-shrink: 0;
      position: sticky; top: var(--header-h);
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: left;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--bg-soft); color: var(--text); }
    .nav-item.active {
      background: var(--primary-soft-2);
      color: var(--primary-hover);
      font-weight: 600;
    }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }

    .main {
      flex: 1; min-width: 0;
      padding: 20px 16px 100px;
      max-width: 100%;
    }

    /* Bottom nav (mobile) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--bottom-nav-h);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 40;
    }
    .bottom-nav-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      color: var(--text-soft);
      font-size: 10px;
      font-weight: 500;
      transition: color 0.15s ease;
      padding: 6px 4px;
      position: relative;
    }
    .bottom-nav-item .nav-icon { font-size: 20px; }
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-item .nav-badge {
      position: absolute; top: 6px; right: 50%;
      transform: translateX(16px);
      margin: 0;
      font-size: 10px;
      padding: 1px 5px;
      min-width: 16px;
    }

    @media (min-width: 900px) {
      .sidebar { display: block; }
      .bottom-nav { display: none; }
      .main { padding: 28px 32px 40px; }
    }

    /* ============================================================
       PAGE TITLES
       ============================================================ */
    .page-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.4px;
    }
    .page-actions {
      margin-left: auto;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    @media (min-width: 600px) {
      .page-title { font-size: 26px; }
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius);
      font-size: 14px; font-weight: 600;
      transition: all 0.15s ease;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover { background: var(--bg-soft); }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: var(--bg-soft); color: var(--text); }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success {
      background: var(--success);
      color: white;
    }
    .btn-success:hover { background: #15803d; }
    .btn-warning {
      background: var(--warning);
      color: white;
    }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-lg { padding: 12px 20px; font-size: 15px; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      display: flex; align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 15px; font-weight: 600;
      letter-spacing: -0.2px;
    }
    .card-subtitle {
      font-size: 13px; color: var(--text-muted);
    }

    /* Stat grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .stat-value {
      font-size: 28px; font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin-top: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    .stat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .grid-2 {
      display: grid; gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    /* ============================================================
       LISTS
       ============================================================ */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      transition: all 0.15s ease;
      display: flex; align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .list-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--primary-soft-2);
      color: var(--primary-hover);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .avatar.lg { width: 56px; height: 56px; font-size: 20px; }
    .avatar.sm { width: 32px; height: 32px; font-size: 12px; }

    /* ============================================================
       BADGES
       ============================================================ */
    .badge {
      display: inline-flex; align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.2px;
    }
    .badge-success { background: var(--success-soft); color: #15803d; }
    .badge-warning { background: var(--warning-soft); color: #b45309; }
    .badge-danger { background: var(--danger-soft); color: #b91c1c; }
    .badge-info { background: var(--info-soft); color: #0369a1; }
    .badge-neutral { background: var(--bg-soft); color: var(--text-muted); }
    .badge-soft { background: #f1f5f9; color: #64748b; }
    .badge-primary { background: var(--primary-soft); color: var(--primary-hover); }

    /* ============================================================
       FORMS
       ============================================================ */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-label .req { color: var(--danger); margin-left: 2px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      transition: all 0.15s ease;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,148,136,.12);
    }
    .form-textarea { resize: vertical; min-height: 90px; font-family: inherit; }
    .form-help {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-row {
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 600px) {
      .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
      .form-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .search-bar {
      position: relative;
      flex: 1; min-width: 0;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--card);
      font-size: 14px;
    }
    .search-bar::before {
      content: '🔍';
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }
    .filter-chip:hover { background: var(--bg-soft); }
    .filter-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--card);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
      display: flex; flex-direction: column;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @media (min-width: 700px) {
      .modal-backdrop { align-items: center; padding: 24px; }
      .modal { max-width: 600px; border-radius: var(--radius-lg); }
      .modal.modal-lg { max-width: 800px; }
    }
    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      gap: 12px;
      position: sticky; top: 0;
      background: var(--card);
      z-index: 1;
    }
    .modal-title {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.3px;
      flex: 1;
    }
    .modal-body { padding: 20px; flex: 1; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
      flex-wrap: wrap;
      position: sticky; bottom: 0;
      background: var(--card);
    }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast-container {

<script>
/* ============================================================
   ENERGY FORCE — CRM Coaching
   v0.1 — 2026
   ============================================================ */

const VERSION = 'v0.18';
/* ============================================================
   🔧 CONFIGURATION — À MODIFIER UNE SEULE FOIS
   ============================================================
   Colle ci-dessous l'URL de ton backend Apps Script (celle qui
   finit par /exec). Une fois renseignée et le fichier redéployé
   sur Netlify, tous tes appareils l'utiliseront automatiquement.

const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwJeDUaa8WAyO3VKObcR2izTpll_PyYb66hoE809adrj7o2Xb9uXdDGCnDPTrPTrHsW/exec';
/* ============================================================ */

const APP_NAME = 'EnergyForce';

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  // Priorité : URL hardcodée > URL localStorage (fallback de migration)
  BACKEND_URL: BACKEND_URL || localStorage.getItem('ef_backend_url') || '',
  // PIN par défaut au tout premier démarrage (à changer dans les Paramètres)
  DEFAULT_PIN: '141214',
  // Indicatif téléphonique par défaut
  // Source de vérité = backend (Settings.phone_prefix). Cache local pour boot offline.
  PHONE_PREFIX: localStorage.getItem('ef_phone_prefix_cache') || '+596'
};

/* ============================================================
   STATE
   ============================================================ */
let state = {
  mode: 'real',           // 'real' | 'demo'
  authed: false,
  route: 'dashboard',
  routeParams: {},
  pin: '',
  data: {
    clients: [],
    sessions: [],
    bookings: []
  },
  filters: {
    clientSearch: '',
    clientStatut: 'tous',
    sessionType: 'tous'
  }
};

let demoSnapshot = null;
let pinAttempts = parseInt(localStorage.getItem('ef_pin_attempts') || '0', 10);
let pinLockedUntil = parseInt(localStorage.getItem('ef_pin_locked_until') || '0', 10);

/* ============================================================
   UTIL — LOG, ID, DATE, ESCAPE
   ============================================================ */
function log(...args) { console.log(`[${APP_NAME}]`, ...args); }
function warn(...args) { console.warn(`[${APP_NAME}]`, ...args); }
function err(...args) { console.error(`[${APP_NAME}]`, ...args); }

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function nowIso() { return new Date().toISOString(); }

function fmtDate(d) {
  if (!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '';
  return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '';
  return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' à ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function todayIsoDate() {
  return new Date().toISOString().slice(0, 10);
}

/* Normalise une date pour <input type="date"> (format yyyy-mm-dd).
   Gère : déjà bon format, ISO complet, format français, objet Date,
   ou valeur retournée par Google Sheets (qui peut être un timestamp). */
function normalizeDateForInput(d) {
  if (!d && d !== 0) return '';
  // Déjà bon format
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  // Format français dd/mm/yyyy ou dd-mm-yyyy
  if (typeof d === 'string') {
    const m = d.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  // Sinon : tentative de parsing
  try {
    const date = new Date(d);
    if (isNaN(date.getTime())) return '';
    // On veut la date locale (pas UTC) pour éviter le décalage de fuseau
    const y = date.getFullYear();
    const mo = String(date.getMonth() + 1).padStart(2, '0');
    const da = String(date.getDate()).padStart(2, '0');
    return `${y}-${mo}-${da}`;
  } catch (e) { return ''; }
}

/* Normalise une heure pour <input type="time"> (format HH:mm). */
function normalizeTimeForInput(t) {
  if (!t && t !== 0) return '';
  // Déjà bon format
  if (typeof t === 'string' && /^\d{2}:\d{2}$/.test(t)) return t;
  // Format avec secondes
  if (typeof t === 'string' && /^\d{2}:\d{2}:\d{2}/.test(t)) return t.slice(0, 5);
  // Format ISO ou objet Date : extraire les heures locales
  try {
    const date = new Date(t);
    if (!isNaN(date.getTime())) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }
  } catch (e) {}
  // Format texte type "9h30", "9:30", "09h30"
  if (typeof t === 'string') {
    const m = t.match(/(\d{1,2})[h:.](\d{0,2})/);
    if (m) return `${m[1].padStart(2,'0')}:${(m[2] || '00').padStart(2,'0')}`;
  }
  return '';
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function avatarColor(name) {
  const palette = ['#5B7FBF','#0284c7','#7c3aed','#db2777','#f59e0b','#16a34a','#dc2626','#475569'];
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ============================================================
   PHONE FORMAT
   Convertit un numéro saisi en format international E.164 sans le +
   (utilisable directement dans https://wa.me/...)
   Accepte tous les formats :
   - "+596696123456" → "596696123456"
   - "00596696123456" → "596696123456"
   - "0696123456" + indicatif "+596" → "596696123456"
   - "696 12 34 56" + indicatif "+596" → "596696123456"
   ============================================================ */
function formatPhoneE164(phone, defaultPrefix) {
  if (!phone) return '';
  const prefix = (defaultPrefix || CONFIG.PHONE_PREFIX || '+33').replace(/[^0-9]/g, '');
  // Supprime tout ce qui n'est pas chiffre ou +
  let s = String(phone).replace(/[\s.\-()_/]/g, '').trim();
  if (!s) return '';
  // Format international avec +
  if (s.charAt(0) === '+') {
    return s.substring(1).replace(/\D/g, '');
  }
  // Format international avec 00
  if (s.indexOf('00') === 0 && s.length > 4) {
    return s.substring(2).replace(/\D/g, '');
  }
  // Numéro local commençant par 0 : on enlève le 0 et on préfixe
  s = s.replace(/\D/g, '');
  if (s.charAt(0) === '0') {
    s = s.substring(1);
    return prefix + s;
  }
  // HEURISTIQUE : si le numéro a 10+ chiffres et commence par les chiffres
  // de l'indicatif par défaut (ex : "596696978872" avec indicatif +596),
  // on considère qu'il est déjà au format E164 sans le +
  // Cela évite le double-préfixage des numéros stockés ainsi.
  if (s.length >= 10 && prefix && s.indexOf(prefix) === 0) {
    return s;
  }
  // HEURISTIQUE 2 : si le numéro a 11-15 chiffres (longueur typique E164),
  // et commence par un chiffre d'indicatif courant (1, 2, 3, 4, 5, 6, 7, 8, 9),
  // on le considère déjà E164. Cela couvre les cas où l'utilisateur a saisi
  // un numéro étranger sans le + (ex : "33612345678" pour la France).
  if (s.length >= 11 && s.length <= 15) {
    return s;
  }
  // Sinon : numéro court, on préfixe par défaut
  return prefix + s;
}

/* Affichage lisible d'un numéro avec le + devant (pour UI) */
function displayPhone(phone, defaultPrefix) {
  const e164 = formatPhoneE164(phone, defaultPrefix);
  return e164 ? '+' + e164 : (phone || '');
}

/* ============================================================
   CRYPTO — hash SHA-256 pour stocker le PIN sans le révéler
   ============================================================ */
async function sha256(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(String(str));
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

/* ============================================================
   SETTINGS SYNC — stocke les préférences dans le backend
   pour qu'elles soient partagées entre tous les appareils.
   Cache local pour résilience hors-ligne.
   Clés gérées : pin_hash, phone_prefix
   ============================================================ */
const Settings = {
  cache: {},

  /** Charge les paramètres depuis le backend, fallback sur cache local */
  async loadFromBackend(silent = true) {
    if (state.mode === 'demo') return;
    if (!CONFIG.BACKEND_URL) {
      this._loadFromCache();
      return;
    }
    try {
      const res = await apiCall('getSettings');
      if (res && res.ok && Array.isArray(res.data)) {
        const remote = {};
        res.data.forEach(s => { if (s.key) remote[s.key] = s.value; });
        this.cache = remote;
        localStorage.setItem('ef_settings_cache', JSON.stringify(remote));
        this._applyToConfig(remote);
        log('Settings synced from backend', remote);
      } else {
        this._loadFromCache();
      }
    } catch (e) {
      err('settings load failed, fallback to local cache', e);
      this._loadFromCache();
      if (!silent) toast('Paramètres chargés depuis le cache local', 'info');
    }
  },

  _loadFromCache() {
    try {
      const raw = localStorage.getItem('ef_settings_cache');
      if (raw) {
        this.cache = JSON.parse(raw);
        this._applyToConfig(this.cache);
      }
    } catch (e) { /* ignore */ }
  },

  _applyToConfig(s) {
    if (s.phone_prefix) {
      CONFIG.PHONE_PREFIX = s.phone_prefix;
      localStorage.setItem('ef_phone_prefix_cache', s.phone_prefix);
    }
    // pin_hash est lu directement depuis Settings.cache au moment de la vérification
  },

  /** Persiste un paramètre vers le backend ET le cache local */
  async setValue(key, value) {
    this.cache[key] = value;
    localStorage.setItem('ef_settings_cache', JSON.stringify(this.cache));
    if (state.mode === 'demo') return { ok: true, demo: true };
    if (!CONFIG.BACKEND_URL) {
      throw new Error('Backend non configuré');
    }
    const res = await apiCall('setSetting', { key: key, value: String(value) });
    if (!res || !res.ok) {
      throw new Error('Échec de l\u2019enregistrement distant');
    }
    return res;
  },

  get(key, fallback) {
    return this.cache[key] !== undefined ? this.cache[key] : fallback;
  }
};

/* ============================================================
   AUDIT LOG (LOCAL + DISTANT)
   ============================================================ */
function audit(action, details = {}) {
  try {
    const entry = { timestamp: nowIso(), action, details, mode: state.mode };
    const local = JSON.parse(localStorage.getItem('ef_audit') || '[]');
    local.unshift(entry);
    localStorage.setItem('ef_audit', JSON.stringify(local.slice(0, 200)));
    log('audit', entry);
    if (state.mode === 'real' && CONFIG.BACKEND_URL) {
      // Fire and forget — pas critique
      fetch(CONFIG.BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'audit', data: entry })
      }).catch(() => {});
    }
  } catch (e) { warn('audit failed', e); }
}

   TOAST
   ============================================================ */
function toast(message, type = 'info', duration = 3500) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  t.innerHTML = `<span class="toast-icon">${icons[type] || ''}</span><span>${escapeHtml(message)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'all 0.3s ease';
    t.style.opacity = '0'; t.style.transform = 'translateY(-10px)';
    setTimeout(() => t.remove(), 300);
  }, duration);
}

/* ============================================================
   PIN / AUTH (Schéma B)
   ============================================================ */
const PIN = {
  init() {
    const keypad = document.getElementById('pin-keypad');
    const layout = ['1','2','3','4','5','6','7','8','9','#','0','⌫'];
    keypad.innerHTML = layout.map(k => {
      const isAction = (k === '#' || k === '⌫');
      return `<button class="pin-key ${isAction ? 'action' : ''}" data-k="${k}">${k}</button>`;
    }).join('');
    keypad.addEventListener('click', e => {
      const btn = e.target.closest('.pin-key');
      if (!btn) return;
      const k = btn.dataset.k;
      this.handleKey(k);
    });
    document.addEventListener('keydown', e => {
      if (state.authed) return;
      if (/^[0-9]$/.test(e.key)) this.handleKey(e.key);
      else if (e.key === '#') this.handleKey('#');
      else if (e.key === 'Backspace') this.handleKey('⌫');
      else if (e.key === 'Enter' && state.pin.length === 6) this.submit();
    });
    this.refresh();
  },

  handleKey(k) {
    if (this.isLocked()) { this.refresh(); return; }
    if (k === '⌫') {
      state.pin = state.pin.slice(0, -1);
    } else if (state.pin.length < 6) {
      state.pin += k;
    }
    this.refresh();
    if (state.pin.length === 6) {
      setTimeout(() => this.submit(), 150);
    }
  },

  isLocked() {
    return Date.now() < pinLockedUntil;
  },

  refresh() {
    const dots = document.querySelectorAll('#pin-display .pin-dot');
    dots.forEach((d, i) => {
      d.classList.toggle('filled', i < state.pin.length);
      d.classList.remove('error');
    });
    const msg = document.getElementById('pin-msg');
    if (this.isLocked()) {
      const mins = Math.ceil((pinLockedUntil - Date.now()) / 60000);
      msg.textContent = `🔒 Verrouillé. Réessaie dans ${mins} min`;
      msg.className = 'pin-msg error';
    } else {
      msg.textContent = 'Saisis ton code PIN à 6 chiffres';
      msg.className = 'pin-msg';
    }
  },

  isWeak(pin) {
    if (/^(\d)\1{5}$/.test(pin)) return true; // 000000, 111111…
    if (/^123456$|^654321$|^012345$|^543210$/.test(pin)) return true;
    return false;
  },

  async submit() {
    if (this.isLocked()) return;
    const enteredHash = await sha256(state.pin);
    const remoteHash = Settings.get('pin_hash', '');
    const localPlain = localStorage.getItem('ef_pin') || CONFIG.DEFAULT_PIN;

    let isValid = false;
    if (remoteHash) {
      // Source de vérité : hash dans le Settings backend (partagé entre appareils)
      isValid = (enteredHash === remoteHash);
    } else {
      // Pas encore de hash distant (premier appareil ou backend down)
      // → fallback sur PIN clair local + DEFAULT_PIN
      isValid = (state.pin === localPlain);
    }

    if (isValid) {
      pinAttempts = 0;
      localStorage.setItem('ef_pin_attempts', '0');
      localStorage.setItem('ef_pin_locked_until', '0');
      audit('login_success');

      // Migration douce : si pas de hash distant mais PIN valide localement,
      // on push le hash vers le backend pour partager entre appareils
      if (!remoteHash && state.mode !== 'demo' && CONFIG.BACKEND_URL) {
        try {
          await Settings.setValue('pin_hash', enteredHash);
          log('PIN hash pushed to backend (migration)');
        } catch (e) {
          err('PIN hash push failed', e);
        }
      }

      App.enterReal();
    } else {
      pinAttempts++;
      localStorage.setItem('ef_pin_attempts', String(pinAttempts));
      audit('login_fail', { attempts: pinAttempts });
      const dots = document.querySelectorAll('#pin-display .pin-dot');
      dots.forEach(d => d.classList.add('error'));
      const msg = document.getElementById('pin-msg');
      msg.className = 'pin-msg error';
      msg.textContent = 'PIN incorrect';
      setTimeout(() => {
        state.pin = '';
        if (pinAttempts >= 15) {
          pinLockedUntil = Date.now() + 24*60*60*1000;
          localStorage.setItem('ef_pin_locked_until', String(pinLockedUntil));
        } else if (pinAttempts >= 10) {
          pinLockedUntil = Date.now() + 60*60*1000;
          localStorage.setItem('ef_pin_locked_until', String(pinLockedUntil));
        } else if (pinAttempts >= 5) {
          pinLockedUntil = Date.now() + 5*60*1000;
          localStorage.setItem('ef_pin_locked_until', String(pinLockedUntil));
        }
        this.refresh();
      }, 600);
    }
  }
};

/* ============================================================
   API / SYNC
   ============================================================ */
async function apiCall(action, data = {}, retries = 3) {
  if (state.mode === 'demo') {
    log('apiCall (demo - skipped):', action);
    return { ok: true, demo: true };
  }
  if (!CONFIG.BACKEND_URL) {
    warn('Pas d\'URL backend configurée');
    return { ok: false, error: 'no_backend' };
  }
  const delays = [300, 800, 2000];
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(CONFIG.BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, data })
      });
      const json = await res.json();
      if (json.ok === false) throw new Error(json.error || 'Backend error');
      return json;
    } catch (e) {
      warn(`apiCall ${action} attempt ${i+1} failed`, e);
      if (i < retries - 1) await new Promise(r => setTimeout(r, delays[i]));
      else throw e;
    }
  }
}

async function syncToBackend(action, data) {
  if (state.mode === 'demo') {
    log('syncToBackend skipped (demo):', action);
    return { ok: true, demo: true };
  }
  if (!CONFIG.BACKEND_URL) {
    warn('syncToBackend: pas d\'URL backend, données stockées localement');
    return { ok: false, error: 'no_backend' };
  }
  try {
    return await apiCall(action, data);
  } catch (e) {
    err('syncToBackend failed', e);
    return { ok: false, error: e.message };
  }
}

/* ============================================================

   ============================================================ */
const App = {
  async init() {
    log(`booting ${VERSION}`);
    PIN.init();

    // Affichage dynamique de la version sur l'écran de connexion (toujours à jour)
    const splashVer = document.getElementById('splash-version');
    if (splashVer) splashVer.textContent = VERSION;

    // Service worker / PWA manifest dynamique
    this.installManifest();

    // Toujours démarrer sur le dashboard à la connexion (pas de restauration
    // de la dernière route pour éviter les "client introuvable" si l'ID
    // a été modifié/supprimé entre temps)
    state.route = 'dashboard';

    // Synchronisation des paramètres partagés (PIN hash, indicatif, etc.)
    // depuis le backend AVANT l'écran de PIN, pour que tous les appareils
    // utilisent le même PIN et les mêmes préférences.
    Settings._loadFromCache(); // charge instantanément depuis le cache local
    if (CONFIG.BACKEND_URL) {
      // Affiche un petit indicateur "syncing"
      const splashFooter = document.querySelector('.splash-footer');
      const originalFooter = splashFooter ? splashFooter.innerHTML : '';
      if (splashFooter) splashFooter.innerHTML = originalFooter + ' · 🔄 sync…';
      Settings.loadFromBackend(true).finally(() => {
        if (splashFooter) splashFooter.innerHTML = originalFooter;
        // Refresh l'UI splash : indication discrète si PIN partagé en place
        this._updateSplashSecurityHint();
      });
    } else {
      this._updateSplashSecurityHint();
    }
  },

  _updateSplashSecurityHint() {
    const hint = document.getElementById('splash-security-hint');
    if (!hint) return;
    const hasRemoteHash = !!Settings.get('pin_hash', '');
    if (!CONFIG.BACKEND_URL) {
      // URL ni hardcodée ni en localStorage : on propose de la saisir (cas exceptionnel)
      hint.innerHTML = '⚙️ <a href="#" onclick="event.preventDefault();Actions.setupBackendFromSplash()" style="color:var(--primary);">Configurer le serveur de données</a>';
      hint.style.display = 'block';
    } else if (hasRemoteHash) {
      hint.innerHTML = '🔗 PIN partagé entre tes appareils';
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
  },

  installManifest() {
    const manifest = {
      name: 'Energy Force CRM',
      short_name: 'Energy Force',
      start_url: '.',
      display: 'standalone',
      background_color: '#f7f8fa',
      theme_color: '#5B7FBF',
      icons: [
        { src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%235B7FBF'/><text x='50%25' y='62%25' font-family='Arial' font-size='110' text-anchor='middle' fill='white' font-weight='bold'>EF</text></svg>",
          sizes: '192x192', type: 'image/svg+xml' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  },

  async activateDemo() {
    log('Activating demo mode');
    state.mode = 'demo';
    demoSnapshot = generateDemoData();
    state.data = JSON.parse(JSON.stringify(demoSnapshot));
    state.authed = true;
    audit('demo_activated');
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('demo-badge').classList.remove('hidden');
    toast('Mode démonstration activé', 'success');
    this.go(state.route || 'dashboard');
  },

  async enterReal() {
    log('Entering real mode');
    state.mode = 'real';
    state.authed = true;
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('demo-badge').classList.add('hidden');

    // Charger depuis cache local pour résilience
    this.loadFromCache();
    this.go(state.route || 'dashboard');

    // Sync depuis backend (settings + data)
    if (CONFIG.BACKEND_URL) {
      Settings.loadFromBackend(true); // refresh settings en arrière-plan
      this.syncNow(true);
      this.startAutoSync();
    } else {
      toast('Aucun backend configuré — données locales uniquement', 'warning', 5000);
    }
  },

  loadFromCache() {
    try {
      const cached = localStorage.getItem('ef_data_cache');
      if (cached) {
        state.data = JSON.parse(cached);
        log('Loaded from cache', state.data);
      }
    } catch (e) { warn('Cache load failed', e); }
  },

  saveToCache() {
    if (state.mode === 'demo') return;
    try {
      localStorage.setItem('ef_data_cache', JSON.stringify(state.data));
    } catch (e) { warn('Cache save failed', e); }
  },

  async syncNow(silent = false) {
    if (state.mode === 'demo') {
      if (!silent) toast('Pas de sync en mode démo', 'info');
      return;
    }
    if (!CONFIG.BACKEND_URL) {
      if (!silent) toast('Configurez l\'URL du backend dans Paramètres', 'warning');
      return;
    }
    const btn = document.getElementById('sync-btn');
    btn.classList.add('spin');
    if (!silent) showLoader();
    try {
      // Snapshot avant sync : on retient les ids et statuts des bookings actuels
      const beforeIds = new Set(state.data.bookings.filter(b => b.statut === 'en_attente').map(b => b.id));
      const beforePendingCount = beforeIds.size;

      const res = await apiCall('getAllData');
      if (res && res.ok) {
        state.data = {
          clients: res.data.clients || [],
          sessions: res.data.sessions || [],
          bookings: res.data.bookings || []
        };
        this.saveToCache();
        this.refreshCurrentView();

        // Détection nouveaux bookings en_attente (probablement reçus via webhook)
        const afterPending = state.data.bookings.filter(b => b.statut === 'en_attente');
        const newOnes = afterPending.filter(b => !beforeIds.has(b.id));
        if (newOnes.length > 0) {
          const noms = newOnes.slice(0, 2).map(b => b.nom || 'Inconnu').join(', ');
          const more = newOnes.length > 2 ? ` (+${newOnes.length - 2})` : '';
          toast(`📥 ${newOnes.length} nouvelle${newOnes.length > 1 ? 's' : ''} réservation${newOnes.length > 1 ? 's' : ''} cal.com : ${noms}${more}`, 'success', 6000);
        } else if (!silent) {
          toast('Synchronisation réussie', 'success');
        }
      } else {
        if (!silent) toast('Erreur de synchronisation', 'error');
      }
    } catch (e) {
      err('sync failed', e);
      if (!silent) toast('Synchronisation échouée — données locales conservées', 'error');
    } finally {
      btn.classList.remove('spin');
      hideLoader();
    }
  },

  startAutoSync() {
    // Auto-refresh toutes les 3 minutes en mode réel pour récupérer les nouveaux webhooks cal.com
    if (this._autoSyncTimer) clearInterval(this._autoSyncTimer);
    this._autoSyncTimer = setInterval(() => {
      if (state.mode !== 'real') return;
      if (!CONFIG.BACKEND_URL) return;
      // Skip si un modal est ouvert (utilisateur en train de saisir quelque chose)
      const modal = document.querySelector('.modal-backdrop:not(.hidden)');
      if (modal) return;
      // Skip si onglet pas visible
      if (document.hidden) return;
      log('autosync tick');
      this.syncNow(true);
    }, 180000); // 3 min
  },

  stopAutoSync() {
    if (this._autoSyncTimer) {
      clearInterval(this._autoSyncTimer);
      this._autoSyncTimer = null;
    }
  },

  logout() {
    confirmModal('Se déconnecter ?', () => {
      audit('logout');
      this.stopAutoSync();
      state.authed = false;
      if (state.mode === 'demo') {
        state.data = { clients: [], sessions: [], bookings: [] };
        demoSnapshot = null;
      }
      state.mode = 'real';
      state.pin = '';
      document.getElementById('app').classList.remove('active');
      document.getElementById('splash').style.display = 'flex';
      document.getElementById('demo-badge').classList.add('hidden');
      PIN.refresh();
    });
  },

  go(route, params = {}) {
    state.route = route;
    state.routeParams = params;
    this.refreshNav();
    this.render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  refreshNav() {
    document.querySelectorAll('[data-route]').forEach(el => {
      const r = el.dataset.route;
      const isActive =
        r === state.route ||
        (r === 'clients' && state.route === 'client') ||
        (r === 'sessions' && (state.route === 'session' || state.route === 'session-edit')) ||
        (r === 'settings' && state.route === 'audit');
      el.classList.toggle('active', isActive);
    });

    // Badge réservations en attente
    const pendingCount = state.data.bookings.filter(b => b.statut === 'en_attente').length;
    ['bookings-badge', 'bookings-badge-mobile'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      if (pendingCount > 0) {
        el.classList.remove('hidden');
        el.textContent = String(pendingCount);
      } else {
        el.classList.add('hidden');
      }
    });
  },

  refreshCurrentView() {
    this.render();
    this.refreshNav();
  },

  render() {
    const main = document.getElementById('main');
    switch (state.route) {
      case 'dashboard':     main.innerHTML = Views.dashboard(); break;
      case 'clients':       main.innerHTML = Views.clients(); Views.attachClientsHandlers(); break;
      case 'client':        main.innerHTML = Views.clientDetail(state.routeParams.id); break;
      case 'sessions':      main.innerHTML = Views.sessions(); Views.attachSessionsHandlers(); break;
      case 'session':       main.innerHTML = Views.sessionDetail(state.routeParams.id); break;
      case 'bookings':      main.innerHTML = Views.bookings(); break;
      case 'settings':      main.innerHTML = Views.settings(); break;
      case 'audit':         main.innerHTML = Views.audit(); break;
      default:              main.innerHTML = Views.dashboard();
    }
  }
};

  toggleProspectFields(statut) {
    const block = document.getElementById('prospect-fields');

  toggleProspectRecallDate(substate) {
    const group = document.getElementById('prospect-recall-date-group');
    if (group) group.style.display = (substate === 'a_rappeler') ? '' : 'none';
  },

  async saveClient(existingId) {
    const f = document.getElementById('client-form');
    // Normalisation du téléphone : on stocke toujours au format +XXXXXXXXXX
    // pour éviter toute ambiguïté ultérieure
    const rawPhone = f.telephone.value.trim();
    const normalizedPhone = rawPhone ? '+' + formatPhoneE164(rawPhone) : '';
    const tarif = f.tarif_seance ? parseFloat(f.tarif_seance.value) || 0 : 0;
    const data = {
      id: existingId || uid('cl'),
      nom_complet: f.nom_complet.value.trim(),
      telephone: normalizedPhone,
      email: f.email.value.trim(),
      statut: f.statut.value,
      metier: f.metier.value.trim(),
      typologie: f.typologie.value.trim(),
      objectif: f.objectif.value.trim(),
      commentaires: f.commentaires.value.trim(),
      tarif_seance: tarif > 0 ? String(tarif) : '',
      // Champs prospect (toujours sauvegardés, mais effectifs uniquement si statut=prospect)
      prospect_substate: f.prospect_substate ? f.prospect_substate.value : 'nouveau',
      prospect_recall_date: (f.prospect_substate && f.prospect_substate.value === 'a_rappeler' && f.prospect_recall_date) ? f.prospect_recall_date.value : '',
      prospect_source: f.prospect_source ? f.prospect_source.value.trim() : '',
      prospect_notes: f.prospect_notes ? f.prospect_notes.value.trim() : '',
      date_modification: nowIso()
    };
    if (!data.nom_complet) { toast('Nom requis', 'error'); return; }

    // Détection des transitions de statut pour tracker les dates clés
    const previousClient = existingId ? state.data.clients.find(c => c.id === existingId) : null;
    const wasProspect = previousClient && previousClient.statut === 'prospect';
    const isNowActive = data.statut === 'actif';
    const isNowProspect = data.statut === 'prospect';

    // Premier contact : date de création du prospect (ou maintenant pour un nouveau prospect direct)
    if (isNowProspect && !previousClient) {
      data.prospect_first_contact = todayIsoDate();
    } else if (previousClient) {
      data.prospect_first_contact = previousClient.prospect_first_contact || (previousClient.statut === 'prospect' ? (previousClient.date_creation || '').slice(0,10) : '');
    }

    // Date de conversion : à enregistrer la première fois qu'un prospect devient actif
    if (wasProspect && isNowActive && !(previousClient && previousClient.prospect_converted_at)) {
      data.prospect_converted_at = todayIsoDate();
    } else if (previousClient && previousClient.prospect_converted_at) {
      data.prospect_converted_at = previousClient.prospect_converted_at;
    }

    if (existingId) {
      const idx = state.data.clients.findIndex(c => c.id === existingId);
      if (idx >= 0) state.data.clients[idx] = { ...state.data.clients[idx], ...data };
      audit('client_update', { id: data.id, nom: data.nom_complet });
    } else {
      data.date_creation = nowIso();
      state.data.clients.push(data);
      audit('client_create', { id: data.id, nom: data.nom_complet });
    }
    App.saveToCache();
    closeModal();
    App.refreshCurrentView();

    showLoader();
    const res = await syncToBackend(existingId ? 'updateClient' : 'addClient', data);
    hideLoader();
    if (res.ok) toast(`Client ${existingId ? 'modifié' : 'créé'}`, 'success');
    else if (res.demo) toast(`Client ${existingId ? 'modifié' : 'créé'} (démo)`, 'success');
    else toast('Sauvegardé localement (sync échouée)', 'warning');

    if (state.route === 'client') App.go('client', { id: data.id });
  },

  deleteClient(id) {
    const c = state.data.clients.find(x => x.id === id);
    if (!c) return;
    confirmModal(`Supprimer définitivement ${c.nom_complet} et tout son historique ?`, async () => {
      state.data.clients = state.data.clients.filter(x => x.id !== id);

  async saveSession(existingId) {
    const f = document.getElementById('session-form');
    let clientId = f.client_id.value;
    if (!clientId && f.client_id_hidden) clientId = f.client_id_hidden.value;
    if (!clientId) { toast('Client requis', 'error'); return; }
    const client = state.data.clients.find(c => c.id === clientId);
    if (!client) { toast('Client introuvable', 'error'); return; }

    const data = {
      id: existingId || uid('se'),
      client_id: clientId,
      client_nom: client.nom_complet,
      date: f.date.value,
      heure: f.heure ? f.heure.value : '',
      type: f.type.value,
      realise: f.realise.value.trim(),
      notes: f.notes.value.trim(),
      recommandations: f.recommandations.value.trim()
    };
    if (existingId) {
      const idx = state.data.sessions.findIndex(s => s.id === existingId);
      if (idx >= 0) state.data.sessions[idx] = { ...state.data.sessions[idx], ...data };
      audit('session_update', { id: data.id, client_id: clientId });
    } else {
      data.date_creation = nowIso();
      state.data.sessions.push(data);
      audit('session_create', { id: data.id, client_id: clientId });
    }
    App.saveToCache();
    closeModal();
    App.refreshCurrentView();

    showLoader();
    const res = await syncToBackend(existingId ? 'updateSession' : 'addSession', data);
    hideLoader();
    if (res.ok) toast(`Séance ${existingId ? 'modifiée' : 'enregistrée'}`, 'success');
    else if (res.demo) toast(`Séance ${existingId ? 'modifiée' : 'enregistrée'} (démo)`, 'success');
    else toast('Sauvegardé localement (sync échouée)', 'warning');
  },

  deleteSession(id) {
    confirmModal('Supprimer cette séance ?', async () => {
      state.data.sessions = state.data.sessions.filter(s => s.id !== id);
      audit('session_delete', { id });
      App.saveToCache();
      App.refreshCurrentView();
      toast('Séance supprimée', 'success');
      const res = await syncToBackend('deleteSession', { id });
      if (!res.ok && !res.demo) toast('Sync échouée', 'warning');
    }, { danger: true, confirmLabel: 'Supprimer' });
  },

  async saveBooking(existingId) {
    const f = document.getElementById('booking-form');
    const data = {
      id: existingId || uid('bk'),
      nom: f.nom.value.trim(),
      email: f.email.value.trim(),
      telephone: f.telephone.value.trim(),
      date_rdv: f.date_rdv.value,
      heure_rdv: f.heure_rdv.value,
      message: f.message.value.trim(),
      statut: existingId ? (state.data.bookings.find(x=>x.id===existingId)?.statut || 'en_attente') : 'en_attente',
      source: 'cal.com',
      date_reception: existingId ? (state.data.bookings.find(x=>x.id===existingId)?.date_reception || nowIso()) : nowIso()
    };
    if (!data.nom) { toast('Nom requis', 'error'); return; }

    if (existingId) {
      const idx = state.data.bookings.findIndex(b => b.id === existingId);
      if (idx >= 0) state.data.bookings[idx] = { ...state.data.bookings[idx], ...data };
      audit('booking_update', { id: data.id });
    } else {
      state.data.bookings.unshift(data);
      audit('booking_create', { id: data.id, nom: data.nom });
    }
    App.saveToCache();
    closeModal();
    App.refreshCurrentView();

    const res = await syncToBackend(existingId ? 'updateBooking' : 'addBooking', data);
    if (res.ok) toast('Réservation enregistrée', 'success');
    else if (res.demo) toast('Réservation enregistrée (démo)', 'success');
    else toast('Sauvegardée localement', 'warning');
  },

  async setBookingStatus(id, statut) {
    const idx = state.data.bookings.findIndex(b => b.id === id);
    if (idx < 0) return;
    const b = state.data.bookings[idx];

    // VALIDATION → workflow complet (matching client + création séance)
    if (statut === 'valide') {
      this.openValidateBookingFlow(b);
      return;
    }

    // Sinon (refuse, en_attente) : changement direct
    state.data.bookings[idx] = { ...b, statut };
    audit('booking_status', { id, statut });
    App.saveToCache();
    App.refreshCurrentView();
    const labels = { refuse: 'refusée', en_attente: 'remise en attente' };
    toast(`Réservation ${labels[statut] || statut}`, 'success');
    await syncToBackend('updateBooking', state.data.bookings[idx]);
  },

  // ===== WORKFLOW DE VALIDATION D'UNE RÉSERVATION =====
  // Étape 1 : identifier le client (match auto, choix manuel, ou création)
  // Étape 2 : créer la séance correspondante dans le planning
  // Étape 3 : marquer le booking comme validé + lié au client_id

  openValidateBookingFlow(booking) {
    // Recherche de candidats client
    const emailLow = (booking.email || '').toLowerCase().trim();
    const nomLow = (booking.nom || '').toLowerCase().trim();
    const phoneNorm = formatPhoneE164(booking.telephone || '');

    // Match exact email = très haute confiance
    const exactByEmail = emailLow ? state.data.clients.find(c =>
      (c.email || '').toLowerCase().trim() === emailLow
    ) : null;

    // Match exact téléphone E164 = haute confiance
    const exactByPhone = (!exactByEmail && phoneNorm) ? state.data.clients.find(c =>
      formatPhoneE164(c.telephone || '') === phoneNorm
    ) : null;

    // Match nom (sensibilité moindre, juste suggestion)
    const candidatesByName = (!exactByEmail && !exactByPhone && nomLow) ? state.data.clients.filter(c =>
      c.nom_complet.toLowerCase().trim() === nomLow
    ) : [];

    const exactMatch = exactByEmail || exactByPhone;
    const matchReason = exactByEmail ? 'email identique' : exactByPhone ? 'téléphone identique' : '';

    let bodyHtml = `
      <div style="background:var(--info-soft);border-left:3px solid var(--info);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;">
        <div class="font-semibold mb-1">📅 Réservation à valider</div>
        <div class="text-sm" style="line-height:1.5;">
          <b>${escapeHtml(booking.nom)}</b><br>
          ${booking.email ? `📧 ${escapeHtml(booking.email)}<br>` : ''}
          ${booking.telephone ? `📱 ${escapeHtml(displayPhone(booking.telephone))}<br>` : ''}
          🕐 ${escapeHtml(fmtDate(booking.date_rdv))} à ${escapeHtml(booking.heure_rdv || '—')}
        </div>
      </div>
    `;

    if (exactMatch) {
      bodyHtml += `
        <div style="background:var(--success-soft);border-left:3px solid var(--success);padding:12px;border-radius:var(--radius-sm);margin-bottom:12px;">
          <div class="font-semibold mb-1">✓ Client reconnu (${matchReason})</div>
          <div class="list" style="margin-top:8px;">
            <div class="list-item" style="cursor:default;">
              <div class="avatar sm" style="background:${avatarColor(exactMatch.nom_complet)}20;color:${avatarColor(exactMatch.nom_complet)};">${initials(exactMatch.nom_complet)}</div>
              <div class="grow">
                <div class="font-semibold">${escapeHtml(exactMatch.nom_complet)}</div>
                <div class="text-xs text-muted">${escapeHtml(exactMatch.metier || '—')} · ${escapeHtml(exactMatch.statut)}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else if (candidatesByName.length > 0) {
      bodyHtml += `
        <div style="background:var(--warning-soft);border-left:3px solid var(--warning);padding:12px;border-radius:var(--radius-sm);margin-bottom:12px;">
          <div class="font-semibold mb-1">⚠ Même nom détecté (à vérifier)</div>
          <div class="text-xs mb-2" style="color:var(--text-muted);">Email/téléphone différents — assure-toi que c'est bien la même personne.</div>
          <div class="list">
            ${candidatesByName.map(c => `
              <div class="list-item" onclick="Actions._validateWithClient('${booking.id}','${c.id}')" style="cursor:pointer;">
                <div class="avatar sm" style="background:${avatarColor(c.nom_complet)}20;color:${avatarColor(c.nom_complet)};">${initials(c.nom_complet)}</div>
                <div class="grow">
                  <div class="font-semibold">${escapeHtml(c.nom_complet)}</div>
                  <div class="text-xs text-muted">${escapeHtml(c.email || '—')} · ${escapeHtml(displayPhone(c.telephone) || '—')}</div>
                </div>
                <span class="text-xs" style="color:var(--primary);">Choisir →</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else {
      bodyHtml += `
        <div style="background:var(--card);border:1px dashed var(--border);padding:12px;border-radius:var(--radius-sm);margin-bottom:12px;text-align:center;">
          <div class="font-semibold mb-1">🆕 Nouveau client</div>
          <div class="text-xs text-muted">Aucune correspondance trouvée dans tes fiches existantes.</div>
        </div>
      `;
    }

    // Boutons d'action selon le contexte
    let footerHtml = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button>`;
    if (exactMatch) {
      footerHtml += `
        <button class="btn btn-ghost" onclick="Actions.openClientPicker('${booking.id}')">Choisir un autre client</button>
        <button class="btn btn-primary" onclick="Actions._validateWithClient('${booking.id}','${exactMatch.id}')">✓ Confirmer ce client</button>
      `;
    } else {
      footerHtml += `
        <button class="btn btn-secondary" onclick="Actions.openClientPicker('${booking.id}')">📂 Client existant</button>
        <button class="btn btn-primary" onclick="Actions._validateWithNewClient('${booking.id}')">＋ Créer une fiche client</button>
      `;
    }

    openModal({
      title: '✓ Valider la réservation',
      size: 'lg',
      body: bodyHtml,
      footer: footerHtml
    });
  },

  _filterClientPicker(query) {

  // Sous-flow : on a un client, on passe à la création de séance
  _validateWithClient(bookingId, clientId) {
    const booking = state.data.bookings.find(b => b.id === bookingId);
    const client = state.data.clients.find(c => c.id === clientId);
    if (!booking || !client) { toast('Erreur : booking ou client introuvable', 'error'); return; }
    this.openSessionFromBookingForm(booking, client, false);
  },

  // Sous-flow : pas de client trouvé, on crée d'abord la fiche
  _validateWithNewClient(bookingId) {
    const booking = state.data.bookings.find(b => b.id === bookingId);
    if (!booking) { toast('Erreur : booking introuvable', 'error'); return; }

    // Création directe d'une fiche client minimale à partir du booking
    const newClient = {
      id: uid('cl'),
      nom_complet: booking.nom,
      telephone: booking.telephone || '',
      email: booking.email || '',
      statut: 'actif',
      metier: '', typologie: '', objectif: '',
      commentaires: booking.message ? `Message initial (cal.com) : ${booking.message}` : '',
      date_creation: nowIso(),
      date_modification: nowIso()
    };
    state.data.clients.push(newClient);
    audit('client_auto_create', { id: newClient.id, from_booking: bookingId });
    App.saveToCache();
    syncToBackend('addClient', newClient);
    toast(`Fiche créée pour ${newClient.nom_complet}`, 'success');

    // Enchaîne sur la création de la séance
    this.openSessionFromBookingForm(booking, newClient, true);
  },

  openSessionFromBookingForm(booking, client, isNewClient) {
    const sessionType = isNewClient ? 'initial' : 'suivi';
    const presetDate = normalizeDateForInput(booking.date_rdv) || todayIsoDate();

    openModal({
      title: '📅 Ajouter au planning',
      size: 'lg',
      body: `
        <div style="background:var(--success-soft);border-left:3px solid var(--success);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;">
          <div class="font-semibold mb-1">✓ Client ${isNewClient ? 'créé' : 'rattaché'} : ${escapeHtml(client.nom_complet)}</div>
          <div class="text-xs" style="color:var(--text-muted);">Date et heure récupérées depuis cal.com — modifiables si besoin.</div>
        </div>
        <form id="session-from-booking-form" onsubmit="event.preventDefault();Actions._finalizeBookingValidation('${booking.id}','${client.id}');">

              <label class="form-label">Date<span class="req">*</span></label>
              <input class="form-input" type="date" name="date" required value="${escapeHtml(presetDate)}">
            </div>
            <div class="form-group">
              <label class="form-label">Heure</label>
              <input class="form-input" type="time" name="heure" value="${escapeHtml(presetTime)}">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Type de séance<span class="req">*</span></label>
            <select class="form-select" name="type" required>
              <option value="initial" ${sessionType === 'initial' ? 'selected' : ''}>Initiale (1ʳᵉ rencontre)</option>
              <option value="suivi" ${sessionType === 'suivi' ? 'selected' : ''}>Suivi</option>
              <option value="controle">Contrôle</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Notes / contexte</label>
            <textarea class="form-input" name="notes" rows="3" placeholder="Préparations, attentes, contexte du RDV…">${escapeHtml(booking.message || '')}</textarea>
          </div>
        </form>
      `,
      footer: `
        <button class="btn btn-secondary" onclick="Actions.openValidateBookingFlow(state.data.bookings.find(b=>b.id==='${booking.id}'))">← Retour</button>
        <button class="btn btn-primary" onclick="document.getElementById('session-from-booking-form').requestSubmit()">✓ Valider et ajouter</button>
      `
    });
  },

  // Étape finale : on enregistre tout (séance, booking validé, client_id rattaché)
  async _finalizeBookingValidation(bookingId, clientId) {
    const booking = state.data.bookings.find(b => b.id === bookingId);
    const client = state.data.clients.find(c => c.id === clientId);
    if (!booking || !client) { toast('Erreur', 'error'); return; }

    const f = document.getElementById('session-from-booking-form');
    const session = {
      id: uid('se'),
      client_id: client.id,
      client_nom: client.nom_complet,
      date: f.date.value,
      heure: f.heure.value || '',
      type: f.type.value,
      realise: '',
      notes: f.notes.value.trim(),
      recommandations: '',
      date_creation: nowIso()
    };

    // Mise à jour atomique des deux entités
    state.data.sessions.push(session);
    const idx = state.data.bookings.findIndex(b => b.id === bookingId);
    state.data.bookings[idx] = {
      ...booking,
      statut: 'valide',
      client_id: client.id
    };

    // CONVERSION AUTO : si le client était prospect, il passe en actif
    let prospectConverted = false;
    if (client.statut === 'prospect') {
      const cidx = state.data.clients.findIndex(c => c.id === client.id);
      if (cidx >= 0) {
        state.data.clients[cidx] = {
          ...state.data.clients[cidx],
          statut: 'actif',
          prospect_converted_at: state.data.clients[cidx].prospect_converted_at || todayIsoDate(),
          prospect_first_contact: state.data.clients[cidx].prospect_first_contact || (state.data.clients[cidx].date_creation || '').slice(0,10),
          date_modification: nowIso()
        };
        prospectConverted = true;
        audit('prospect_auto_converted', { client_id: client.id, from_booking: bookingId });
        syncToBackend('updateClient', state.data.clients[cidx]);
      }
    }

    audit('booking_validated', { booking_id: bookingId, client_id: client.id, session_id: session.id });
    App.saveToCache();
    closeModal();
    App.refreshCurrentView();
    if (prospectConverted) {
      toast(`🎉 ${client.nom_complet} : prospect converti en client actif + séance ajoutée`, 'success', 6000);
    } else {
      toast(`✓ Réservation validée et ajoutée au planning`, 'success', 5000);
    }

    // Sync backend (en parallèle)
    syncToBackend('addSession', session);
    syncToBackend('updateBooking', state.data.bookings[idx]);

    // Propose d'ouvrir la fiche client pour avoir le contexte complet
    setTimeout(() => {
      App.go('client', { id: client.id });
    }, 800);
  },

  async savePin() {
    const f = document.getElementById('pin-form');
    const cur = f.current.value, n1 = f.new1.value, n2 = f.new2.value;

    // Vérifie l'ancien PIN : d'abord contre le hash distant, sinon fallback local
    const remoteHash = Settings.get('pin_hash', '');
    const localPlain = localStorage.getItem('ef_pin') || CONFIG.DEFAULT_PIN;
    const curHash = await sha256(cur);
    const curOk = remoteHash ? (curHash === remoteHash) : (cur === localPlain);
    if (!curOk) { toast('PIN actuel incorrect', 'error'); return; }

    if (n1 !== n2) { toast('Les PIN ne correspondent pas', 'error'); return; }
    if (!/^[0-9#]{6}$/.test(n1)) { toast('PIN invalide (6 caractères, chiffres ou #)', 'error'); return; }
    if (PIN.isWeak(n1)) { toast('PIN trop faible', 'error'); return; }

    const newHash = await sha256(n1);
    showLoader('Synchronisation du PIN…');
    try {
      // Source de vérité = backend
      await Settings.setValue('pin_hash', newHash);
      // On supprime l'ancien PIN clair local (devenu obsolète)
      localStorage.removeItem('ef_pin');
      audit('pin_changed');
      hideLoader();
      closeModal();
      toast('PIN modifié — synchronisé sur tous tes appareils', 'success', 5000);
    } catch (e) {
      hideLoader();
      err('savePin failed', e);
      toast('Échec de la synchronisation : ' + e.message, 'error');
    }
  },

    const client = state.data.clients.find(c => c.id === clientId);

    const defaultDate = new Date();

    openModal({
      title: '📞 Programmer un rappel',

  async _saveProspectRecall(clientId) {
    const dateInput = document.getElementById('recall-date-input');
    const noteInput = document.getElementById('recall-note-input');
    if (!dateInput.value) { toast('Date requise', 'error'); return; }
    const idx = state.data.clients.findIndex(c => c.id === clientId);
    if (idx < 0) return;
    state.data.clients[idx] = {
      ...state.data.clients[idx],
      prospect_substate: 'a_rappeler',
      prospect_recall_date: dateInput.value,
      prospect_notes: noteInput.value.trim(),
      date_modification: nowIso()
    };
    audit('prospect_recall_scheduled', { client_id: clientId, date: dateInput.value });
    App.saveToCache();
    closeModal();
    App.refreshCurrentView();
    toast(`📞 Rappel programmé pour le ${fmtDate(dateInput.value)}`, 'success');
    syncToBackend('updateClient', state.data.clients[idx]);
  },

  _postRecall(clientId, decision) {
    closeModal();
    const client = state.data.clients.find(c => c.id === clientId);
    if (!client) return;
    if (decision === 'link_resent') {
      this.sendBookingLinkWhatsApp(client);
    } else if (decision === 'reschedule') {
      this.scheduleProspectRecall(clientId);
    } else if (decision === 'convert') {
      this.convertProspectToActive(clientId);
    } else if (decision === 'no_recall') {
      this._updateClientField(clientId, 'prospect_substate', 'ne_pas_rappeler');
      toast(`${client.nom_complet} marqué comme « Ne pas rappeler »`, 'info');
    }
  },

  // Convertit un prospect en client actif
  convertProspectToActive(clientId) {
    const client = state.data.clients.find(c => c.id === clientId);
    if (!client) return;
    confirmModal(
      `Convertir ${client.nom_complet} en client actif ?`,
      () => {
        const idx = state.data.clients.findIndex(c => c.id === clientId);
        state.data.clients[idx] = {
          ...state.data.clients[idx],
          statut: 'actif',
          prospect_converted_at: state.data.clients[idx].prospect_converted_at || todayIsoDate(),
          prospect_first_contact: state.data.clients[idx].prospect_first_contact || (state.data.clients[idx].date_creation || '').slice(0,10),
          date_modification: nowIso()
        };
        audit('prospect_converted', { client_id: clientId });
        App.saveToCache();
        App.refreshCurrentView();
        toast(`🎉 ${client.nom_complet} est maintenant client actif !`, 'success', 5000);
        syncToBackend('updateClient', state.data.clients[idx]);
      },
      { confirmLabel: 'Convertir', title: '🎯 Conversion prospect' }

  // Helper interne pour mettre à jour un seul champ d'un client
  _updateClientField(clientId, field, value) {
    const idx = state.data.clients.findIndex(c => c.id === clientId);
    if (idx < 0) return;
    state.data.clients[idx] = {
      ...state.data.clients[idx],
      [field]: value,
      date_modification: nowIso()
    };
    App.saveToCache();
    App.refreshCurrentView();
    syncToBackend('updateClient', state.data.clients[idx]);
  },

      );

  async testWebhookConnection() {
    const url = CONFIG.BACKEND_URL || '';
    if (!url) { toast('Configure l\u2019URL backend d\u2019abord', 'error'); return; }
    if (state.mode === 'demo') { toast('Test impossible en mode démo', 'info'); return; }
    closeModal();
    showLoader('Envoi d\u2019un faux booking au backend…');
    const fakePayload = {
      triggerEvent: 'BOOKING_CREATED',
      createdAt: new Date().toISOString(),
      payload: {
        uid: 'test-frontend-' + Date.now(),
        bookingId: 'test-' + Date.now(),
        startTime: new Date(Date.now() + 86400000 * 2).toISOString(),
        endTime: new Date(Date.now() + 86400000 * 2 + 1800000).toISOString(),
        additionalNotes: 'Test depuis l\u2019app Energy Force — peut être supprimé',
        organizer: { name: 'Test', email: 'test@example.fr', timeZone: 'Europe/Paris' },
        attendees: [{ name: 'Client Test (à supprimer)', email: 'client.test@exemple.fr', phoneNumber: '+33600000000', timeZone: 'Europe/Paris' }]
      }
    };
    try {
      const res = await fetch(url, {
        method: 'POST',
        body: JSON.stringify(fakePayload),
        headers: { 'Content-Type': 'text/plain' },
        redirect: 'follow'
      });
      const json = await res.json();
      hideLoader();
      if (json.ok) {
        toast('✓ Test réussi ! Synchronisation en cours…', 'success');
        await App.syncNow();
      } else {
        toast('Backend a refusé : ' + (json.error || 'erreur inconnue'), 'error');
      }
    } catch (err) {
      hideLoader();
      toast('Échec du test : ' + err.message, 'error');
    }
  },

  exportDataNoop() {} // placeholder
